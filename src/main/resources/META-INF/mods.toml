modLoader="javafml"
loaderVersion="${loader_version_range}"
license="${mod_license}"

[[mods]]
modId="${mod_id}"
version="${mod_version}"
displayName="${mod_name}"
authors="${mod_authors}"
description='''${mod_description}'''

[[dependencies.${mod_id}]]
    modId="forge"
    mandatory=true
    versionRange="${forge_version_range}"
    ordering="NONE"
    side="BOTH"

[[dependencies.${mod_id}]]
    modId="minecraft"
    mandatory=true
    versionRange="${minecraft_version_range}"
    ordering="NONE"
    side="BOTH"

# Valkyrien Skies 2 carries the constructs (ships, physics, rendering, collision). Needed on both sides.
[[dependencies.${mod_id}]]
    modId="valkyrienskies"
    mandatory=true
    versionRange="${vs2_version_range}"
    ordering="AFTER"
    side="BOTH"

# BSP-Core: the Shatter Coins that buy a core's tiers, the metals in the parts' recipes, totems, teams and the admin list.
[[dependencies.${mod_id}]]
    modId="bsp_core"
    mandatory=true
    versionRange="${bsp_core_version_range}"
    ordering="AFTER"
    side="BOTH"
