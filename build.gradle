plugins {
    id 'eclipse'
    id 'idea'
    id 'net.minecraftforge.gradle' version '[6.0,6.2)'
}

version = mod_version
group = mod_group_id

base {
    archivesName = mod_archive_name
}

java.toolchain.languageVersion = JavaLanguageVersion.of(17)

minecraft {
    mappings channel: mapping_channel, version: mapping_version
    copyIdeResources = true

    runs {
        configureEach {
            workingDirectory project.file('run')
            property 'forge.logging.markers', 'REGISTRIES'
            property 'forge.logging.console.level', 'debug'
            // Other mods' mixins (Valkyrien Skies has hundreds) carry obfuscated names: remap their reference maps in a dev run.
            property 'mixin.env.remapRefMap', 'true'
            property 'mixin.env.refMapRemappingFile', "${projectDir}/build/createSrgToMcp/output.srg"

            mods {
                "${mod_id}" {
                    source sourceSets.main
                }
            }
        }

        client {
            property 'forge.enabledGameTestNamespaces', mod_id
        }

        server {
            property 'forge.enabledGameTestNamespaces', mod_id
            args '--nogui'
        }

        // ./gradlew runGameTestServer: runs every registered GameTest headlessly and exits.
        gameTestServer {
            property 'forge.enabledGameTestNamespaces', mod_id
        }

        data {
            workingDirectory project.file('run-data')
            args '--mod', mod_id, '--all', '--output', file('src/generated/resources/'), '--existing', file('src/main/resources/')
        }
    }
}

sourceSets.main.resources { srcDir 'src/generated/resources' }

repositories {
    mavenCentral()
    // Valkyrien Skies 2, the released Forge jar (the same file players and servers install).
    maven {
        name = 'Modrinth'
        url = 'https://api.modrinth.com/maven'
        content { includeGroup 'maven.modrinth' }
    }
    // The open parts of the Valkyrien Skies core (api, util), for compiling; at runtime they sit inside the VS2 jar.
    maven {
        name = 'Valkyrien Skies'
        url = 'https://maven.valkyrienskies.org'
        content { includeGroup 'org.valkyrienskies.core' }
    }
    maven {
        name = 'Kotlin for Forge'
        url = 'https://thedarkcolour.github.io/KotlinForForge/'
        content { includeGroup 'thedarkcolour' }
    }
    // BSP-Core has no published artifact: its built jar is picked up from the sibling repo.
    flatDir { dirs bsp_core_libs }
    // Dev-run-only jars, not shipped.
    flatDir { dirs 'libs' }
}

dependencies {
    minecraft "net.minecraftforge:forge:${minecraft_version}-${forge_version}"

    // Valkyrien Skies 2: required. Only compat/ValkyrienSkiesBridge touches it.
    implementation fg.deobf("maven.modrinth:valkyrien-skies:${vs2_version}")
    compileOnly "org.valkyrienskies.core:api:${vs_core_version}"
    compileOnly "org.valkyrienskies.core:util:${vs_core_version}"
    compileOnly "org.joml:joml-primitives:${joml_primitives_version}"
    compileOnly "org.jetbrains.kotlin:kotlin-stdlib:${kotlin_stdlib_version}"
    // Kotlin for Forge, which Valkyrien Skies needs at runtime (the pack carries the same version).
    runtimeOnly "thedarkcolour:kotlinforforge:${kotlinforforge_version}"

    // BSP-Core, optional at runtime: only compat/BspCore touches it, and only when the mod is loaded.
    compileOnly fg.deobf("blank:bsp-core:${bsp_core_version}")
    // Dev runs load it (the full jar, so they also get the MySQL driver BSP-Core ships).
    runtimeOnly fg.deobf("blank:bsp-core:${bsp_core_version}")
}

tasks.named('processResources', ProcessResources).configure {
    var replaceProperties = [
            minecraft_version: minecraft_version, minecraft_version_range: minecraft_version_range,
            forge_version: forge_version, forge_version_range: forge_version_range,
            loader_version_range: loader_version_range,
            mod_id: mod_id, mod_name: mod_name, mod_license: mod_license, mod_version: mod_version,
            mod_authors: mod_authors, mod_description: mod_description,
            vs2_version_range: vs2_version_range, bsp_core_version_range: bsp_core_version_range,
    ]
    inputs.properties replaceProperties
    filesMatching(['META-INF/mods.toml', 'pack.mcmeta']) {
        expand replaceProperties + [project: project]
    }
}

tasks.named('jar', Jar).configure {
    manifest {
        attributes([
                'Specification-Title'     : mod_id,
                'Specification-Vendor'    : mod_authors,
                'Specification-Version'   : '1',
                'Implementation-Title'    : project.name,
                'Implementation-Version'  : project.jar.archiveVersion,
                'Implementation-Vendor'   : mod_authors,
                'Implementation-Timestamp': new Date().format("yyyy-MM-dd'T'HH:mm:ssZ"),
        ])
    }
    finalizedBy 'reobfJar'
}

tasks.withType(JavaCompile).configureEach {
    options.encoding = 'UTF-8'
}

// The screen text: every key the client code looks up must exist in the language file (tools/gen_lang.py writes it).
tasks.register('checkLang', Exec) {
    group = 'verification'
    description = 'Checks the client code against the language file (tools/check_lang.py).'
    commandLine 'python3', 'tools/check_lang.py'
    inputs.files(fileTree('src/main/java/com/mrgregles/bsp_mobile/client'), 'src/main/resources/assets/bsp_mobile/lang/en_us.json', 'tools/check_lang.py')
    outputs.upToDateWhen { true }
}
tasks.named('check') {
    dependsOn 'checkLang'
}
