org.gradle.jvmargs=-Xmx3G
org.gradle.daemon=false

minecraft_version=1.20.1
minecraft_version_range=[1.20.1,1.21)
forge_version=47.4.23
forge_version_range=[47,)
loader_version_range=[47,)
mapping_channel=official
mapping_version=1.20.1

mod_id=bsp_mobile
mod_name=BSP-Mobile
mod_license=MIT
mod_version=0.1.0
mod_group_id=com.mrgregles.bsp_mobile
mod_authors=Mrgregles
mod_description=Moving bases for the Build Secure Protect (BSP) network: a Mobile Core turns the blocks around it into a construct that drives, floats or flies, with every machine aboard still working.
mod_archive_name=bsp-mobile

# Valkyrien Skies 2 carries the moving blocks (ships, physics, rendering, collision). Required at runtime.
# The mod layer comes from Modrinth's maven as the released Forge jar; the core's open api and util artifacts
# (bundled inside that jar at runtime) come from the Valkyrien Skies maven for compiling. Keep the two in step:
# vs_core_version is the vs_core_version of the VS2 release's own gradle.properties.
vs2_version=1.20.1-forge-2.4.11
vs2_version_range=[2.4.11,)
vs_core_version=1.1.0+cf208d8b56
# Valkyrien Skies is written in Kotlin and needs Kotlin for Forge at runtime (the pack carries 4.12.0).
kotlinforforge_version=4.12.0
# The Kotlin standard library VS2 2.4.x is built with, for compiling against its classes only.
kotlin_stdlib_version=1.9.22
joml_primitives_version=1.10.0

# BSP-Core is required at runtime (its coins buy the tiers, its metals craft the parts); compiled against the sibling repo's built jar (no published artifact). Build BSP-Core first.
bsp_core_version=1.4.5
bsp_core_version_range=[1.4.5,)
bsp_core_libs=../BSP-Core/build/libs
# BSP Region Guard is optional at runtime (the mobile-constructs flag); compiled against the sibling repo's built jar. Build Region Guard first.
bsp_region_guard_version=0.5.0
bsp_region_guard_version_range=[0.5.0,)
bsp_region_guard_libs=../BSP-Region Guard/build/libs
# Region Guard's own dependency, dev runs only (it is compiled against the LuckPerms api; the servers run LuckPerms).
luckperms_api_version=5.4
